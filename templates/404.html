<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>No está esa página — BaratoYa</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#163300" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #163300;
      --lime: #9fe870;
      --paper: #fff;
      --muted: #454745;
      --fog: #e8ebe6;
      --font-ui: "Atkinson Hyperlegible", "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-serif: "Libre Baskerville", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--muted); background: var(--paper); font: 16px/1.6 var(--font-ui); }
    a { color: var(--ink); }
    .nav { min-height: 64px; display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #d9ddd8; }
    .nav a { font-weight: 700; text-decoration: none; letter-spacing: -0.02em; }
    main { flex: 1; width: min(100% - 32px, 40rem); margin: 0 auto; padding: 64px 0; }
    .code { margin: 0 0 8px; font-weight: 700; color: var(--ink); letter-spacing: 0.08em; font-size: 14px; }
    h1 { margin: 0 0 16px; color: var(--ink); font-size: clamp(28px, 4vw, 40px); font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
    p { margin: 0 0 24px; }
    .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 9999px; background: var(--lime); color: var(--ink); font-weight: 600; text-decoration: none; }
    .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    footer { padding: 24px 16px 40px; color: #6a6c6a; border-top: 1px solid var(--fog); }
    footer .wrap { width: min(100% - 32px, 40rem); margin: 0 auto; }
  </style>
</head>
<body>
  <header class="nav"><a href="/">BaratoYa</a></header>
  <main>
    <p class="code">404</p>
    <h1>Esa página no está.</h1>
    <p>La dirección no lleva a nada de BaratoYa. Puede que el enlace esté mal escrito o que la página ya no exista.</p>
    <a class="btn" href="/">Volver a buscar un precio</a>
  </main>
  <footer>
    <div class="wrap">
      <p><a href="/">BaratoYa</a> · <a href="/aviso-precios">Aviso de precios</a> · <a href="/terminos">Términos de uso</a> · <a href="/privacidad">Privacidad</a></p>
    </div>
  </footer>
</body>
</html>
