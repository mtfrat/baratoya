{% if ga_id %}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga_id }}');
  (function () {
    var src = "https://www.googletagmanager.com/gtag/js?id={{ ga_id }}";
    function loadGtag() {
      if (window.__baratoyaGtag) return;
      window.__baratoyaGtag = true;
      var s = document.createElement("script");
      s.async = true;
      s.src = src;
      document.head.appendChild(s);
    }
    function onIdle() {
      if ("requestIdleCallback" in window) requestIdleCallback(loadGtag, {timeout: 3000});
      else setTimeout(loadGtag, 1);
    }
    if (document.readyState === "complete") onIdle();
    else window.addEventListener("load", onIdle, {once: true});
  })();
</script>
{% endif %}
