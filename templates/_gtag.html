{% if ga_id %}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga_id }}');
  (function () {
    var src = "https://www.googletagmanager.com/gtag/js?id={{ ga_id }}";
    var scheduled = false;
    function loadGtag() {
      if (window.__baratoyaGtag) return;
      window.__baratoyaGtag = true;
      var s = document.createElement("script");
      s.async = true;
      s.src = src;
      document.head.appendChild(s);
    }
    function onIdle() {
      if (scheduled) return;
      scheduled = true;
      if ("requestIdleCallback" in window) requestIdleCallback(loadGtag, {timeout: 2000});
      else loadGtag();
    }
    ["pointerdown", "keydown", "scroll", "touchstart"].forEach(function (name) {
      window.addEventListener(name, onIdle, {once: true, passive: true});
    });
    window.addEventListener("load", function () { setTimeout(onIdle, 4000); }, {once: true});
  })();
</script>
{% endif %}
